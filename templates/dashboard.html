<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dev-atlas</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;
--red:#f85149;--yellow:#d29922;--green:#3fb950;--accent:#58a6ff;--card:#1c2128}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
header h1{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.kpis{display:flex;flex-wrap:wrap;gap:1rem;margin-left:auto}
.kpi{font-size:.8rem;color:var(--dim)}
.kpi b{color:var(--text);font-size:.95rem}
.controls{padding:.75rem 1.5rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;border-bottom:1px solid var(--border)}
.controls button,.controls select,.controls input{background:var(--surface);border:1px solid var(--border);
color:var(--text);padding:.35rem .7rem;border-radius:6px;font-size:.8rem;cursor:pointer}
.controls button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.controls input[type=text]{min-width:160px;cursor:text}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem;padding:1rem 1.5rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.9rem;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card h3{font-size:.95rem;margin-bottom:.3rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.badge{font-size:.65rem;padding:.15rem .4rem;border-radius:4px;background:var(--surface);border:1px solid var(--border);color:var(--dim)}
.health-bar{height:6px;border-radius:3px;background:var(--surface);margin:.4rem 0;overflow:hidden}
.health-bar div{height:100%;border-radius:3px}
.meta{font-size:.75rem;color:var(--dim);display:flex;flex-wrap:wrap;gap:.5rem;margin:.3rem 0}
.meta span{white-space:nowrap}
.flags{font-size:.7rem;color:var(--yellow);margin-top:.3rem}
.drawer{display:none;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--border);font-size:.75rem}
.card.expanded .drawer{display:block}
.drawer h4{font-size:.7rem;text-transform:uppercase;color:var(--dim);margin:.5rem 0 .2rem}
.drawer ul{list-style:none;padding:0}
.drawer li{padding:.15rem 0;color:var(--dim)}
.drawer li.pass{color:var(--green)}
.drawer li.fail{color:var(--red)}
</style>
</head>
<body>
<header>
<h1>dev-atlas</h1>
<div class="kpis" id="kpis"></div>
</header>
<div class="controls">
<div id="tabs"></div>
<div id="chips"></div>
<input type="text" id="search" placeholder="search…">
<select id="sort">
<option value="health">Health</option>
<option value="reclaim">Reclaimable</option>
<option value="activity">Last activity</option>
</select>
</div>
<div class="grid" id="grid"></div>
<script>
const DATA = __DATA__;
const buckets=["All",...new Set(DATA.repos.map(r=>r.bucket))];
const chips=[
{id:"attention",label:"Needs Attention",fn:r=>r.health_score<60},
{id:"dirty",label:"Dirty Git",fn:r=>r.git.dirty+r.git.untracked>0},
{id:"unpushed",label:"Unpushed",fn:r=>r.git.ahead>0},
{id:"cold",label:"Cold Bloat",fn:r=>r.bloat_bytes>0&&r.last_activity_days>30}
];
let state={bucket:"All",active:new Set(),search:"",sort:"health"};
function humanBytes(n){if(n<1024)return n+" B";const u=["KiB","MiB","GiB","TiB"];let v=n/1024,i=0;while(v>=1024&&i<3){v/=1024;i++}return v.toFixed(1)+" "+u[i]}
function healthColor(s){return s<60?"var(--red)":s<80?"var(--yellow)":"var(--green)"}
function render(){
const kpis=document.getElementById("kpis");
const repos=DATA.repos;
const total=repos.length;
const avg=total?Math.round(repos.reduce((a,r)=>a+r.health_score,0)/total):0;
const src=repos.reduce((a,r)=>a+r.source_bytes,0);
const bl=repos.reduce((a,r)=>a+r.bloat_bytes,0);
const dirty=repos.filter(r=>r.git.dirty+r.git.untracked>0).length;
const unpushed=repos.filter(r=>r.git.ahead>0).length;
kpis.innerHTML=`<span class="kpi"><b>${total}</b> repos</span><span class="kpi"><b>${avg}</b> avg health</span><span class="kpi"><b>${humanBytes(src)}</b> source</span><span class="kpi"><b>${humanBytes(bl)}</b> reclaimable</span><span class="kpi"><b>${dirty}</b> dirty</span><span class="kpi"><b>${unpushed}</b> unpushed</span>`;
const tabs=document.getElementById("tabs");
tabs.innerHTML=buckets.map(b=>`<button class="${state.bucket===b?"active":""}" data-b="${b}">${b}</button>`).join(" ");
tabs.querySelectorAll("button").forEach(el=>el.onclick=()=>{state.bucket=el.dataset.b;render()});
const chipEl=document.getElementById("chips");
chipEl.innerHTML=chips.map(c=>`<button class="${state.active.has(c.id)?"active":""}" data-c="${c.id}">${c.label}</button>`).join(" ");
chipEl.querySelectorAll("button").forEach(el=>el.onclick=()=>{const id=el.dataset.c;state.active.has(id)?state.active.delete(id):state.active.add(id);render()});
let list=repos.filter(r=>state.bucket==="All"||r.bucket===state.bucket);
chips.forEach(c=>{if(state.active.has(c.id))list=list.filter(c.fn)});
if(state.search){const q=state.search.toLowerCase();list=list.filter(r=>r.display.toLowerCase().includes(q))}
if(state.sort==="health")list.sort((a,b)=>a.health_score-b.health_score);
else if(state.sort==="reclaim")list.sort((a,b)=>b.bloat_bytes-a.bloat_bytes);
else list.sort((a,b)=>b.last_activity_days-a.last_activity_days);
const grid=document.getElementById("grid");
grid.innerHTML=list.map(r=>{
const name=r.display.split("/").pop();
const flags=[];
if(r.health_score<60)flags.push("needs attention");
if(r.git.dirty+r.git.untracked>0)flags.push("dirty");
if(r.git.ahead>0)flags.push("unpushed");
if(r.bloat_bytes>0&&r.last_activity_days>30)flags.push("cold bloat");
const checks=r.checks.map(c=>`<li class="${c.pass?"pass":"fail"}">${c.pass?"✓":"✗"} ${c.name}: ${c.detail}</li>`).join("");
const topf=r.top_files.map(f=>`<li>${f.path} (${f.lines} lines)</li>`).join("");
const blo=r.bloat.map(b=>`<li>${b.path} — ${humanBytes(b.bytes)}</li>`).join("");
const hc=r.hardcoded_paths.length?r.hardcoded_paths.map(p=>`<li>${p}</li>`).join(""):"<li>none</li>";
const cont=r.containers.length?r.containers.map(c=>`<li>${c.name} ${c.image} :${c.port}</li>`).join(""):"<li>none</li>";
const ports=r.ports.length?r.ports.join(", "):"none";
return `<div class="card" data-name="${name}"><h3>${name}<span class="badge">${r.bucket}</span><span class="badge">${r.stack}</span></h3>
<div class="health-bar"><div style="width:${r.health_score}%;background:${healthColor(r.health_score)}"></div></div>
<div class="meta"><span>${r.health_score}/100</span><span>${r.git.branch||"no branch"}</span><span>d:${r.git.dirty} u:${r.git.untracked} +${r.git.ahead}</span><span>${humanBytes(r.source_bytes)}</span><span>${humanBytes(r.bloat_bytes)}</span><span>${r.last_activity_days}d</span></div>
${r.lifecycle?`<div class="meta"><span class="badge">${r.lifecycle}</span></div>`:""}
${flags.length?`<div class="flags">${flags.join(" · ")}</div>`:""}
<div class="drawer"><h4>Checks</h4><ul>${checks||"<li>none</li>"}</ul>
${topf?`<h4>Top Files</h4><ul>${topf}</ul>`:""}
${blo?`<h4>Bloat</h4><ul>${blo}</ul>`:""}
<h4>Hardcoded Paths</h4><ul>${hc}</ul>
<h4>Gitleaks</h4><ul><li>${r.gitleaks}</li></ul>
<h4>Containers</h4><ul>${cont}</ul>
<h4>Ports</h4><ul><li>${ports}</li></ul></div></div>`;
}).join("");
grid.querySelectorAll(".card").forEach(el=>el.onclick=()=>el.classList.toggle("expanded"));
}
document.getElementById("search").oninput=e=>{state.search=e.target.value;render()};
document.getElementById("sort").onchange=e=>{state.sort=e.target.value;render()};
render();
</script>
</body>
</html>
